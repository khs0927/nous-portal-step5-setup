# [aside-zen-fix 2026-10-17] nous step-5 무료주간 10/15 종료 → 무료 nvidia glm-5.3 으로 전환
# 유료 Step 5 원하면 택1:
#   provider: stepfun     / default: step-5-preview   (STEPFUN_API_KEY, 종량제 100RPM)
#   provider: opencode-go / default: step-5-preview   (OPENCODE_GO_API_KEY, $10/월)
model:
  default: z-ai/glm-5.3
  provider: nvidia
  api_mode: chat_completions
providers:
  zen-proxy:
    name: OpenCode Zen Free (cli-opencode-proxy)
    base_url: http://127.0.0.1:18080/v1
    api_key: zen-local
    api_mode: chat_completions
    discover_models: true
    models:
      mimo-v2.6-flash-free:
        context_length: 262144
      glm-5.3-flash-free:
        context_length: 131072
      muse-spark-1.3-contributor-free:
        context_length: 131072
      big-pickle:
        context_length: 131072
  nvidia:
    base_url: https://integrate.api.nvidia.com/v1
    api_key: <REDACTED-keep-your-real-key>
    api_mode: chat_completions
    discover_models: true
    models:
      z-ai/glm-5.3:
        context_length: 131072
      z-ai/glm-5.3-flash:
        context_length: 131072
      nvidia/nemotron-3.5-lightning-30b-a3b:
        context_length: 131072
      nvidia/nemotron-3-super-120b-a12b:
        context_length: 131072
      nvidia/nemotron-3-ultra-550b-a55b:
        context_length: 131072
  atria:
    name: Atria
    base_url: https://api.atria-asi.ai/v1
    model: Atria-Dawn-Preview
    key_env: HERMES_CUSTOM_ATRIA_API_KEY
    api_mode: chat_completions
    discover_models: true
    models:
      Atria-Dawn-Preview:
        context_length: 256000
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 500
  service_tier: ''
  fast_auto_seconds: 60
  verbose: false
  reasoning_effort: ultra
  personalities: {}
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  hygiene_max_turn_hold_seconds: 10
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  bell_on_prompt: false
  show_reasoning: false
  background_process_notifications: concise
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    model: whisper-1
    language: ''
wake_word:
  enabled: false
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
delegation:
  model: z-ai/glm-5.3
  provider: nvidia
  fallback_providers:
    - provider: zen-proxy
      model: muse-spark-1.3-contributor-free
    - provider: nvidia
      model: z-ai/glm-5.3-flash
    - provider: nvidia
      model: nvidia/nemotron-3.5-lightning-30b-a3b
  max_iterations: 400
  reasoning_effort: high
  max_concurrent_children: 10
  max_spawn_depth: 2
  orchestrator_enabled: true
  fast_provider: nvidia
  fast_model: nvidia/nemotron-3.5-lightning-30b-a3b
  flash_provider: nvidia
  flash_model: z-ai/glm-5.3-flash
moa:
  presets:
    default:
      reference_models:
        - provider: zen-proxy
          model: big-pickle
          enabled: true
        - provider: nvidia
          model: z-ai/glm-5.3
          enabled: true
        - provider: nvidia
          model: moonshotai/kimi-k3
          enabled: true
        - provider: nvidia
          model: nvidia/nemotron-3.5-lightning-30b-a3b
          enabled: true
        - provider: gemini
          model: gemini-3.8-flash
          enabled: true
        - provider: zen-proxy
          model: muse-spark-1.3-contributor-free
          enabled: true
      aggregator:
        provider: atria
        model: Atria-Dawn-Preview
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: zen-proxy
      model: big-pickle
      enabled: true
    - provider: nvidia
      model: z-ai/glm-5.3
      enabled: true
    - provider: nvidia
      model: moonshotai/kimi-k3
      enabled: true
    - provider: nvidia
      model: nvidia/nemotron-3.5-lightning-30b-a3b
      enabled: true
    - provider: gemini
      model: gemini-3.8-flash
      enabled: true
    - provider: zen-proxy
      model: muse-spark-1.3-contributor-free
      enabled: true
  aggregator:
    provider: atria
    model: Atria-Dawn-Preview
  degraded_reference_policy: loud
  fanout: user_turn
  enabled: true
skills:
  creation_nudge_interval: 15
command_allowlist:
  - command parser limit or malformed executable payload
  - delete in root path
  - docker restart/stop/kill (container lifecycle)
  - execute_code
  - git reset --hard (destroys uncommitted changes)
  - recursive delete
  - script execution via -e/-c flag
plugins:
  enabled:
    - herdr-agent-state
cron:
  catch_up_missed: true
kanban:
  review_dispatch: true
code_execution:
  timeout: 300
  max_tool_calls: 50
gateway:
  signal_interrupt_grace_timeout: 1
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30.0
  loop_watchdog_probe_timeout_s: 10.0
  loop_watchdog_max_strikes: 3
  bot_loop_guard:
    enabled: true
    max_events: 20
    window_seconds: 300
    cooldown_seconds: 600
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  multiplex_profiles: false
  auto_migrate: true
  profile_routes: []
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  trust_env: true
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10
streaming:
  enabled: false
telemetry:
  shared_metrics:
    enabled: false
    send: false
updates:
  check: true
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
_config_version: 44
group_sessions_per_user: true
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
mcp_servers:
  filesystem:
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-filesystem'
      # filesystem MCP 루트 — 본인 홈 디렉터리로 교체
      - 'C:/Users/<you>'
      - --connect-timeout
      - '90'
    enabled: true
  memory:
    command: npx
    args:
      - -y
      - '@modelcontextprotocol/server-memory'
      - --connect-timeout
      - '90'
    enabled: true
  context7:
    url: https://mcp.context7.com/mcp
    enabled: true
  deepwiki:
    url: https://mcp.deepwiki.com/mcp
    enabled: true
  aws-knowledge:
    url: https://knowledge-mcp.global.api.aws
    enabled: true
    tools:
      exclude:
        - aws___retrieve_skill
  microsoft-learn:
    url: https://learn.microsoft.com/api/mcp
    enabled: true
  twilio-docs:
    url: https://mcp.twilio.com/docs
    enabled: true
  semgrep:
    url: https://mcp.semgrep.ai/mcp
    auth: oauth
    enabled: false
    tools:
      exclude:
        - security_check
        - supported_languages
        - semgrep_rule_schema
  wolfram:
    url: https://agenttools.wolfram.com/mcp
    enabled: true
  hugging_face:
    url: https://huggingface.co/mcp
    auth: oauth
    enabled: false
  time:
    command: npx
    args:
      - -y
      - '@guanxiong/mcp-server-time'
      - --connect-timeout
      - '90'
    enabled: true
  fetch:
    command: npx
    args:
      - -y
      - mcp-server-fetch-typescript
      - --connect-timeout
      - '90'
    enabled: true
  doppler:
    command: npx
    args:
      - -y
      - '@dopplerhq/mcp-server'
      - --read-only
      - --connect-timeout
      - '90'
    env:
      DOPPLER_TOKEN=<REDACTED>
    enabled: false
  a2a-bridge:
    url: http://127.0.0.1:9100/mcp
    connect_timeout: 30
    enabled: false
